<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Happy Birthday Iqra 🎂</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --ivory:#fff8f3;
    --cream:#fdf1e6;
    --pink:#ff5c8d;
    --deepPink:#c72d6e;
    --purple:#8a63d2;
    --gold:#ffb703;
    --teal:#3fc1b0;
    --coral:#ff8a5c;
    --softPink:#ffe1ea;
    --lavender:#e9deff;
    --text:#2e2138;
    --muted:#7c6b83;
    --line:rgba(138,99,210,.2);
    --glass:rgba(255,252,250,.8);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    color:var(--text);
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 8% 6%, rgba(255,183,3,.22), transparent 32%),
        radial-gradient(circle at 92% 10%, rgba(138,99,210,.24), transparent 34%),
        radial-gradient(circle at 88% 92%, rgba(255,92,141,.24), transparent 36%),
        radial-gradient(circle at 10% 92%, rgba(63,193,176,.18), transparent 34%),
        linear-gradient(135deg, var(--ivory), var(--lavender) 55%, var(--cream));
    overflow-x:hidden;
}

.ambient{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.orb{ position:absolute; border-radius:50%; filter:blur(85px); opacity:.35; animation:drift 12s ease-in-out infinite alternate; }
.orb.one{ width:300px; height:300px; background:#ff9ab8; left:-140px; top:-110px; }
.orb.two{ width:340px; height:340px; background:#ffd166; right:-160px; bottom:-120px; animation-delay:-4s; }
.orb.three{ width:250px; height:250px; background:#b79bff; left:45%; top:40%; animation-delay:-7s; opacity:.22; }
.orb.four{ width:220px; height:220px; background:#6fe3d2; left:8%; bottom:-90px; animation-delay:-9s; opacity:.2; }
@keyframes drift{ from{transform:translate(0,0) scale(1);} to{transform:translate(25px,-20px) scale(1.08);} }

.card{
    position:relative; z-index:5; width:min(620px,100%);
    padding:clamp(20px,5vw,32px) clamp(16px,5vw,28px) 26px;
    border:1px solid rgba(255,255,255,.9);
    border-radius:38px; background:var(--glass);
    backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px);
    box-shadow:0 40px 100px rgba(120,50,90,.18), 0 12px 35px rgba(120,50,90,.09);
    overflow:hidden;
}

.header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; color:#9c7595; font-size:.65rem; letter-spacing:.16em; text-transform:uppercase; gap:10px; }
.header span:first-child{ min-width:0; }
.header-heart{ color:var(--pink); font-size:1rem; flex-shrink:0; animation:heartbeat 2.1s ease-in-out infinite; }
@keyframes heartbeat{ 0%,100%{transform:scale(1);} 15%{transform:scale(1.18);} 30%{transform:scale(1);} 45%{transform:scale(1.08);} }

.progress{ height:4px; width:100%; margin-bottom:30px; border-radius:20px; background:#f0e2ea; overflow:hidden; }
.progress-bar{
    height:100%; width:0%; border-radius:20px;
    background:linear-gradient(90deg, var(--pink), var(--gold), var(--purple), var(--teal), var(--pink));
    background-size:300% 100%;
    animation:shimmer 4s linear infinite;
    transition:width 1s cubic-bezier(.2,.8,.2,1);
}
@keyframes shimmer{ 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }

.content{ min-height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation:contentIn .75s cubic-bezier(.2,.8,.2,1) both; }
.content.out{ animation:contentOut .28s ease both; }
@keyframes contentIn{ from{opacity:0; transform:translateY(22px) scale(.985); filter:blur(5px);} to{opacity:1; transform:translateY(0) scale(1); filter:blur(0);} }
@keyframes contentOut{ from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-12px);} }

.icon{
    width:clamp(72px,18vw,96px); height:clamp(72px,18vw,96px);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px; border-radius:50%;
    border:1px solid rgba(199,45,110,.1);
    box-shadow:0 18px 40px rgba(150,60,110,.15), inset 0 1px 0 #fff;
    font-size:clamp(2.2rem,7vw,2.85rem);
    animation:gentleFloat 4s ease-in-out infinite;
    transition:background .3s ease;
}
.icon-c0{ background:linear-gradient(145deg,#ffffff,#ffe4ee); }
.icon-c1{ background:linear-gradient(145deg,#ffffff,#fff1cf); }
.icon-c2{ background:linear-gradient(145deg,#ffffff,#eae0ff); }
.icon-c3{ background:linear-gradient(145deg,#ffffff,#d9f5f0); }
@keyframes gentleFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

h1,h2,h3{ font-family:Georgia,"Times New Roman",serif; font-weight:500; letter-spacing:-.035em; }
h1{ max-width:500px; margin-bottom:14px; font-size:clamp(2.1rem,8vw,3.6rem); line-height:1.06; background:linear-gradient(120deg,var(--deepPink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
h2{ max-width:500px; margin-bottom:16px; font-size:clamp(1.5rem,6vw,2.5rem); line-height:1.18; color:var(--deepPink); word-break:break-word; }
.description{ max-width:475px; color:var(--muted); font-size:clamp(.9rem,3.6vw,1rem); line-height:1.85; }

.quote{
    max-width:470px; margin-top:20px; padding:16px 20px;
    border-left:3px solid var(--pink); border-radius:0 20px 20px 0;
    background:rgba(255,255,255,.6); color:#5e4a5c;
    font-family:Georgia,serif; font-style:italic; font-size:clamp(.9rem,3.6vw,1.03rem); line-height:1.8;
    text-align:left; box-shadow:0 8px 25px rgba(120,60,100,.06);
}

.whisper{ margin-top:18px; color:#a97a9e; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; }

.choice-area{ width:100%; display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:22px; }
.choice{
    padding:11px 16px; border:1px solid var(--line); border-radius:50px;
    background:rgba(255,255,255,.75); color:#6b4f66; cursor:pointer;
    font-size:.87rem; transition:.28s ease; max-width:100%;
}
.choice:hover{ transform:translateY(-3px); background:#fff; border-color:var(--pink); box-shadow:0 10px 25px rgba(150,60,110,.1); }
.choice.selected{
    color:white; border-color:var(--pink);
    background:linear-gradient(135deg, var(--pink), var(--purple));
    transform:translateY(-2px);
}

.actions{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.btn{
    min-width:180px; padding:13px 22px; border-radius:50px; cursor:pointer;
    font-size:.9rem; font-weight:650; transition:transform .25s, box-shadow .25s, opacity .25s;
    border:none;
}
.btn:hover{ transform:translateY(-3px); }
.primary{
    color:white;
    background:linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow:0 13px 30px rgba(150,60,150,.28);
}
.gold-btn{
    color:#5b3d00;
    background:linear-gradient(135deg, #ffe08a, var(--gold));
    box-shadow:0 13px 30px rgba(200,140,0,.25);
}
.teal-btn{
    color:#043c35;
    background:linear-gradient(135deg, #9df0e3, var(--teal));
    box-shadow:0 13px 30px rgba(20,140,120,.22);
}
.btn:disabled{ opacity:.42; cursor:not-allowed; transform:none; }

/* =========== GALLERY (3 surprises) =========== */

.gallery{
    display:flex; flex-direction:column; gap:16px;
    width:100%; margin-top:24px;
}

.gallery-item{
    padding:5px; border-radius:28px;
    background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,183,3,.5), rgba(255,92,141,.4));
    box-shadow:0 24px 60px rgba(150,50,100,.22);
    animation:flowerOpen 1.2s cubic-bezier(.2,.8,.2,1) both;
}
.gallery-item:nth-child(2){ animation-delay:.15s; }
.gallery-item:nth-child(3){ animation-delay:.3s; }

@keyframes flowerOpen{
    0%{ opacity:0; transform:scale(.76) translateY(35px); filter:blur(12px); }
    60%{ opacity:1; transform:scale(1.025) translateY(-2px); filter:blur(0); }
    100%{ transform:scale(1) translateY(0); }
}

.gallery-inner{ overflow:hidden; border-radius:24px; background:#f9ecec; }
.gallery-inner img{
    display:block; width:100%; max-height:400px; object-fit:cover;
    transition:transform 1.5s ease;
}
.gallery-inner:hover img{ transform:scale(1.025); }

.gallery-caption{
    padding:13px 16px 6px;
    font-family:Georgia,serif; font-style:italic;
    color:var(--deepPink); font-size:.94rem; text-align:center; line-height:1.5;
}

.final-message{ margin-top:26px; animation:contentIn .9s .25s both; }
.final-message p{ margin-top:12px; color:var(--muted); font-size:.98rem; line-height:1.9; }
.signature{ margin-top:20px; color:var(--deepPink); font-family:Georgia,serif; font-size:1.05rem; font-style:italic; line-height:1.6; }

.love-list{
    margin-top:22px; padding:20px 20px 6px; text-align:left;
    background:rgba(255,255,255,.55); border-radius:22px;
    border:1px solid var(--line); animation:contentIn .8s .3s both;
}
.love-list h3{ font-size:1.15rem; color:var(--deepPink); margin-bottom:12px; text-align:center; }
.love-list ul{ list-style:none; }
.love-list li{
    padding:8px 0 8px 28px; position:relative;
    color:#5c4a58; font-size:.9rem; line-height:1.65;
    border-bottom:1px dashed rgba(199,45,110,.14);
}
.love-list li:last-child{ border-bottom:none; }
.love-list li::before{
    content:"✦"; position:absolute; left:0; top:8px; color:var(--gold); font-size:1rem;
}

.music-btn-wrap{ margin-top:6px; }

.personal-card{
    margin-top:26px; padding:22px; border:1px solid var(--line); border-radius:25px;
    background:linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,225,234,.7));
    box-shadow:inset 0 1px 0 #fff; text-align:center; animation:contentIn .8s .35s both;
}
.personal-top{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.personal-label{ color:#ad7fa2; font-size:.63rem; letter-spacing:.18em; text-transform:uppercase; }
.badge{ padding:6px 12px; border-radius:50px; background:linear-gradient(135deg,#ffe08a,var(--gold)); color:#5b3d00; font-size:.64rem; font-weight:700; }
.personal-name{ color:#3b2438; font-family:Georgia,serif; font-size:clamp(1.5rem,6vw,1.95rem); word-break:break-word; }
.personal-from{ margin-top:10px; color:#8a6a83; font-size:.85rem; font-style:italic; }

.closing-card{
    margin-top:20px; padding:20px; border-radius:23px;
    background:rgba(255,255,255,.55); border:1px solid rgba(199,45,110,.12);
    animation:contentIn .8s .45s both;
}
.closing-card h3{ font-size:1.25rem; color:var(--deepPink); margin-bottom:10px; }
.closing-card p{ color:var(--muted); font-size:.92rem; line-height:1.8; }

.feelings{ margin-top:28px; padding-top:25px; border-top:1px dashed #e2b9cf; text-align:center; }
.feelings h3{ font-size:1.3rem; color:var(--deepPink); }
.feelings-sub{ margin-top:6px; color:var(--muted); font-size:.84rem; }
.emoji-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:16px; }
.emoji{
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:50%; background:rgba(255,255,255,.75);
    cursor:pointer; font-size:1.3rem; transition:.23s ease;
}
.emoji:hover{ transform:translateY(-4px) scale(1.05); background:white; }
.emoji.active{
    background:var(--softPink); border-color:var(--pink);
    transform:scale(1.1); box-shadow:0 0 0 4px rgba(255,92,141,.14);
}
.reaction{
    margin-top:14px; padding:12px 16px; border-radius:17px;
    background:rgba(255,255,255,.7); color:#6b4f66; font-size:.88rem;
    line-height:1.6; animation:contentIn .4s both;
}

.surprise-more{ margin-top:26px; text-align:center; }
.surprise-box{
    margin-top:18px; padding:22px; border-radius:22px; text-align:center;
    background:linear-gradient(150deg, rgba(255,255,255,.85), rgba(233,222,255,.65));
    border:1px solid var(--line);
    box-shadow:0 20px 55px rgba(140,80,180,.16);
    animation:contentIn .8s both;
}
.surprise-box h3{ color:var(--purple); font-size:1.3rem; margin-bottom:10px; }
.surprise-box p{ color:var(--muted); font-size:.93rem; line-height:1.85; }
.surprise-box .signature{ margin-top:16px; }

/* =========== FALLING / RISING ELEMENTS =========== */

.petals{ position:fixed; inset:0; z-index:100; overflow:hidden; pointer-events:none; }
.petal{ position:absolute; top:-60px; animation:petalFall linear forwards; will-change:transform,opacity; }
@keyframes petalFall{
    0%{ opacity:0; transform:translateY(-10vh) translateX(0) rotate(0deg) scale(.7); }
    10%{ opacity:1; }
    100%{ opacity:0; transform:translateY(115vh) translateX(100px) rotate(720deg) scale(1); }
}

.balloon{ position:absolute; bottom:-70px; animation:balloonRise linear forwards; will-change:transform,opacity; }
@keyframes balloonRise{
    0%{ opacity:0; transform:translateY(0) translateX(0) rotate(-6deg); }
    12%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-125vh) translateX(70px) rotate(6deg); }
}

.footer{ margin-top:22px; text-align:center; color:#a9819d; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; }

@media(max-width:520px){
    body{ padding:10px; }
    .card{ padding:20px 15px 22px; border-radius:30px; }
    .content{ min-height:340px; }
    .actions{ width:100%; }
    .btn{ width:100%; min-width:0; }
    .gallery-inner img{ max-height:280px; }
    .header{ font-size:.58rem; }
}

@media(max-width:400px){
    .card{ padding:16px 12px 18px; border-radius:24px; }
    .icon{ margin-bottom:14px; }
    .quote{ padding:13px 15px; }
    .love-list{ padding:16px 16px 4px; }
    .personal-card, .closing-card, .surprise-box{ padding:16px; }
}

@media(min-width:900px){
    .card{ width:660px; }
}
</style>
</head>


<body>

<div class="ambient">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="orb four"></div>
</div>


<div class="card">

    <div class="header">
        <span>A birthday surprise from Tahir</span>
        <span class="header-heart">♡</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="content" id="content"></div>

    <div class="actions" id="actions"></div>

    <div id="final"></div>

    <div class="footer">
        made with love by Tahir · just for Iqra
    </div>

</div>


<div class="petals" id="petals"></div>


<script>
(function(){
"use strict";

/* =========================================================
   IMAGES
========================================================= */

const GALLERY = [
    { src:"flowern.jpg", caption:"🌸 A little flower for the most beautiful girl I know, who deserves all the beautiful things in the world. ✨❤️" },
    { src:"arooj.jpeg",  caption:"This smile is my favourite thing in the world 🤍" },
    { src:"memory.jpg",  caption:"One of my favourite memories with you 💫" }
];

const GIRLFRIEND_NAME = "Iqra Arooj Fatima";
const SENDER_NAME = "Tahir";

/* =========================================================
   SOUND — everything synthesized, no external audio file needed
========================================================= */

let audioCtx = null;
function getCtx(){
    if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
}

function playChime(){
    const ctx = getCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const t = now + i * 0.09;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.42);
    });
}

function playFanfare(){
    const ctx = getCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    const notes = [392.0, 523.25, 659.25, 783.99, 987.77, 1174.66];
    notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const t = now + i * 0.11;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.55);
    });
}

/* Instrumental "Happy Birthday" melody — the song is public domain,
   played here as synthesized tones (no recording or lyrics used). */
const HBD_MELODY = [
    [261.63,0.28],[261.63,0.28],[293.66,0.5],[261.63,0.5],[349.23,0.5],[329.63,1.0],
    [261.63,0.28],[261.63,0.28],[293.66,0.5],[261.63,0.5],[392.00,0.5],[349.23,1.0],
    [261.63,0.28],[261.63,0.28],[523.25,0.5],[440.00,0.5],[349.23,0.5],[329.63,0.5],[293.66,1.0],
    [466.16,0.28],[466.16,0.28],[440.00,0.5],[349.23,0.5],[392.00,0.5],[349.23,1.0]
];

function playHappyBirthdayTune(){
    const ctx = getCtx();
    if(!ctx) return;
    let t = ctx.currentTime + 0.05;
    HBD_MELODY.forEach(([freq,dur]) => {
        const noteLen = dur * 0.82;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.26, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + noteLen);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + noteLen + 0.05);
        t += dur;
    });
}

/* =========================================================
   CONFETTI / PETAL / BALLOON BURSTS
========================================================= */

const petalsContainer = document.getElementById("petals");

function spawnFalling(items, count, opts){
    opts = opts || {};
    const minSize = opts.minSize || 1;
    const sizeRange = opts.sizeRange || 1.2;
    const minDur = opts.minDur || 2.6;
    const durRange = opts.durRange || 2;
    const stagger = opts.stagger || 55;

    for(let i = 0; i < count; i++){
        setTimeout(function(){
            const el = document.createElement("div");
            el.className = "petal";
            el.textContent = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 100 + "%";
            el.style.fontSize = (minSize + Math.random() * sizeRange) + "rem";
            const dur = minDur + Math.random() * durRange;
            el.style.animationDuration = dur + "s";
            petalsContainer.appendChild(el);
            setTimeout(function(){ el.remove(); }, dur * 1000 + 400);
        }, i * stagger);
    }
}

function spawnBalloons(count, opts){
    opts = opts || {};
    const items = ["🎈","🎈","🎈"];
    const minDur = opts.minDur || 6;
    const durRange = opts.durRange || 3;
    const stagger = opts.stagger || 140;

    for(let i = 0; i < count; i++){
        setTimeout(function(){
            const el = document.createElement("div");
            el.className = "balloon";
            el.textContent = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 100 + "%";
            el.style.fontSize = (1.6 + Math.random() * 1.3) + "rem";
            const dur = minDur + Math.random() * durRange;
            el.style.animationDuration = dur + "s";
            petalsContainer.appendChild(el);
            setTimeout(function(){ el.remove(); }, dur * 1000 + 400);
        }, i * stagger);
    }
}

/* small colourful shower on every click */
function clickBurst(){
    playChime();
    spawnFalling(["🎂","🌸","✨","🎉","💛"], 10, { minSize:1, sizeRange:1, minDur:2.2, durRange:1.4, stagger:35 });
}

/* the big finale */
function grandFinale(){
    spawnFalling(["🌸","🌷","🌹","🌺","🌼","💮","🎂","🎉","🎊","✨","❤️","💜","🧡"], 130, { minSize:1, sizeRange:1.4, minDur:4.5, durRange:4, stagger:32 });
    spawnBalloons(20, { minDur:7, durRange:4, stagger:120 });
}

/* =========================================================
   FLOW
========================================================= */

const STEPS = [

{
    icon:"🎂",
    title:"Hey… beautiful.",
    text:"Before anything else today, I wanted to make you something — a small little corner of the internet, built only for you.",
    quote:"Some gifts fit in a box. This one just fits in a heart.",
    whisper:"A little something from Tahir",
    button:"I'm listening →"
},

{
    icon:"🤍",
    title:"Take a breath.",
    text:"Nothing complicated. Nothing you need to figure out. Just a small birthday moment, made especially for you.",
    quote:"Some of the most meaningful things in life begin quietly, like a candle before it's lit.",
    button:"I'm here"
},

{
    icon:"✨",
    title:"Today is your day.",
    text:"A whole year of you — your laugh, your kindness, the way you turn ordinary days into something worth remembering. Today, all of it gets celebrated.",

{

},

{

    text:"Not just the way you look, not just your smile — the person behind all of it. The way you care, the way you show up, the way you make ordinary moments feel different.",

},

{

    button:"Almost there…"
},

{
    icon:"🎈",
    title:"This year, I wish you…",
    text:"A few small wishes, from me to you.",
    quote:"Health that never worries you.<br>Laughter that finds you on the hardest days.<br>People around you who are as loyal as you deserve.<br>And peace — real, quiet, unshakeable peace.",
    button:"Continue →"
},

{
    icon:"🎁",
    title:"And here's a little something…",
    text:"It's small compared with everything I could say. But I wanted to give you a few little surprises today, each one with its own small message attached.",
    whisper:"Three little things, just for you",
    button:"Show me 🌷"
},

{
    icon:"💌",
    title:"No more steps after this.",
    text:"Just three little surprises, a small shower of flowers, a little song, and a few words I genuinely wanted you to hear on your special day.",
    button:"Open it ✨"
},

{
    icon:"🎂",
    title:"Then this is for you.",
    text:"Take your time.",
    quote:"Some gifts are wrapped in paper. Some are wrapped in feelings. This one is wrapped in both.",
    button:"Open my surprise 🌸"
}

];


let current = 0;
let opened = false;

const content = document.getElementById("content");
const actions = document.getElementById("actions");
const final = document.getElementById("final");
const progressBar = document.getElementById("progressBar");


function updateProgress(){
    const percent = ((current + 1) / STEPS.length) * 100;
    progressBar.style.width = percent + "%";
}


function render(){
    const step = STEPS[current];

    updateProgress();

    content.classList.remove("out");
    void content.offsetWidth;
    content.classList.add("content");

    const iconClass = "icon-c" + (current % 4);

    content.innerHTML = `
        <div class="icon ${iconClass}">${step.icon}</div>
        <h2>${step.title}</h2>
        <div class="description">${step.text}</div>
        ${step.quote ? `<div class="quote">${step.quote}</div>` : ""}
        ${step.whisper ? `<div class="whisper">${step.whisper}</div>` : ""}
    `;

    actions.innerHTML = "";

    if(step.choices){
        const area = document.createElement("div");
        area.className = "choice-area";

        step.choices.forEach(choice => {
            const button = document.createElement("button");
            button.className = "choice";
            button.textContent = choice;

            button.addEventListener("click", function(){
                clickBurst();
                area.querySelectorAll(".choice").forEach(el => el.classList.remove("selected"));
                button.classList.add("selected");
                continueButton.disabled = false;
            });

            area.appendChild(button);
        });

        actions.appendChild(area);

        const continueButton = document.createElement("button");
        continueButton.className = "btn primary";
        continueButton.textContent = "Continue →";
        continueButton.disabled = true;
        continueButton.style.marginTop = "11px";
        continueButton.addEventListener("click", function(){
            clickBurst();
            next();
        });

        actions.appendChild(continueButton);
        return;
    }

    const button = document.createElement("button");
    button.className = "btn primary";
    button.textContent = step.button;
    button.addEventListener("click", function(){
        clickBurst();
        next();
    });
    actions.appendChild(button);
}


function next(){
    if(current < STEPS.length - 1){
        content.classList.add("out");
        setTimeout(function(){
            current++;
            render();
        }, 260);
    }else{
        reveal();
    }
}


function reveal(){
    if(opened) return;
    opened = true;

    progressBar.style.width = "100%";

    content.innerHTML = `
        <div class="icon icon-c0">🎂</div>
        <h1>Happy Birthday</h1>
        <div class="description">
            This little journey was simply my way of saying
            something that words alone don't always manage to say.
        </div>
        <div class="music-btn-wrap">
            <button class="btn teal-btn" id="playSongBtn">🎵 Play a birthday song</button>
        </div>
    `;

    actions.innerHTML = "";

    const galleryHtml = GALLERY.map(item => `
        <div class="gallery-item">
            <div class="gallery-inner">
                <img src="${item.src}" alt="${item.caption}">
            </div>
            <div class="gallery-caption">${item.caption}</div>
        </div>
    `).join("");

    final.innerHTML = `

        <div class="gallery">
            ${galleryHtml}
        </div>

        <div class="final-message">

            <h2>Happy Birthday, Iqra Arooj Fatima, my gorgeous girl 🌸❤️</h2>

            <p>
                These three little things are for you —
                a flower, your own beautiful smile, and a memory
                I've kept close. I hope they bring one on your face
                right now, because you truly deserve it. ❤️🌸
            </p>

            <p>My sweet, gorgeous, wonderful ❤️</p>

            <p>
                Every year with you in it is better than the one before.
                I hope this birthday reminds you how loved, how valued,
                and how special you really are — today, and every ordinary
                day after this one.
            </p>

            <div class="quote">
                If today had a colour, I'd want it to feel like the warmest
                gold — the kind that lingers in a room long after the sun
                has set, the way you linger in mine.
            </div>

            <div class="signature">
                With love, respect, and a heart that believes in you.<br>
                — Tahir 🤍
            </div>

        </div>

        <div class="love-list">
            <h3>A few things I love about you 🌷</h3>
            <ul>
                <li>The way your laugh changes the whole mood of a room.</li>
                <li>How honest you are, even when it would be easier not to be.</li>
                <li>How you care for the people around you without being asked to.</li>
                <li>Your patience, even on the days it isn't easy to have any.</li>
                <li>The way ordinary conversations with you never feel ordinary.</li>
                <li>How you stay you, even when it would be easier not to.</li>
            </ul>
        </div>

        <div class="personal-card">
            <div class="personal-top">
                <div class="personal-label">Especially for</div>
                <div class="badge">✦ BIRTHDAY GIRL</div>
            </div>
            <div class="personal-name">${GIRLFRIEND_NAME}</div>
            <div class="personal-from">with love, from ${SENDER_NAME} 🤍</div>
        </div>

        <div class="closing-card">
            <h3>What I want you to know. 🤍</h3>
            <p>
                I don't promise that every day will be perfect —
                nobody can honestly promise that. But I can promise
                honesty, respect, patience, and loyalty. If you give me
                your loyalty, I will always give you double back — on your
                birthday, and every ordinary day after it.
            </p>
        </div>

        <div class="feelings">
            <h3>Now it's your turn… 🫣</h3>
            <div class="feelings-sub">Tell me without saying a word.</div>

            <div class="emoji-grid">
                <button class="emoji" data-message="That smile is exactly what I hoped for. 🥹❤️">🥹</button>
                <button class="emoji" data-message="Okay… I'll happily take that reaction. 😍">😍</button>
                <button class="emoji" data-message="If I made you laugh, then this was absolutely worth it. 😂❤️">😂</button>
                <button class="emoji" data-message="Speechless? I'll consider that a very good sign. 😳🌸">😳</button>
                <button class="emoji" data-message="That heart means more than you probably know. ❤️">❤️</button>
                <button class="emoji" data-message="Now you're making me blush too. 🙈">🙈</button>
            </div>

            <div class="reaction" id="reaction" style="display:none"></div>
        </div>

        <div class="surprise-more">
            <button class="btn gold-btn" id="oneMoreBtn">One more surprise 🎁</button>
            <div id="surpriseBox"></div>
        </div>
    `;

    setupReactions();
    setupOneMore();
    setupPlaySong();

    grandFinale();
    playHappyBirthdayTune();
}


function setupPlaySong(){
    const btn = document.getElementById("playSongBtn");
    btn.addEventListener("click", function(){
        playHappyBirthdayTune();
        spawnFalling(["🎵","✨","🎶"], 14, { minSize:1, sizeRange:.8, minDur:2.6, durRange:1.4, stagger:40 });
    });
}


function setupReactions(){
    const buttons = document.querySelectorAll(".emoji");
    const reaction = document.getElementById("reaction");

    buttons.forEach(button => {
        button.addEventListener("click", function(){
            playChime();
            buttons.forEach(el => el.classList.remove("active"));
            button.classList.add("active");
            reaction.textContent = button.dataset.message;
            reaction.style.display = "block";
        });
    });
}


function setupOneMore(){
    const btn = document.getElementById("oneMoreBtn");
    const box = document.getElementById("surpriseBox");
    let shown = false;

    btn.addEventListener("click", function(){
        playFanfare();
        grandFinale();

        if(!shown){
            shown = true;
            box.innerHTML = `
                <div class="surprise-box">
                    <h3>Okay, one truly last thing… 🌟</h3>
                    <p>
                        Out of every birthday you'll ever have, I only get to be
                        part of this one exact way, this one exact year. So thank you
                        for letting me be here for it — for your laugh, your honesty,
                        your late-night thoughts, your ordinary Tuesdays, all of it.
                    </p>
                    <p>
                        Here's to another year of you being exactly, wonderfully
                        yourself. Happy Birthday, ${GIRLFRIEND_NAME}. 🎂🌸
                    </p>
                    <div class="signature">Always in your corner.<br>— Tahir 🤍</div>
                </div>
            `;
            btn.textContent = "One more time 🎉";
        }
    });
}


render();

})();
</script>

</html>
