<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Someone Special 🌸</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#fff8fa;
    --bg2:#f4e5e9;
    --card:rgba(255,252,253,.82);
    --text:#30232a;
    --muted:#806d76;
    --rose:#ad6479;
    --rose2:#8c475e;
    --soft:#f2dce2;
    --line:#ead2d9;
    --white:#fff;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;

    color:var(--text);

    background:
        radial-gradient(circle at 10% 10%,#fff 0,transparent 35%),
        radial-gradient(circle at 90% 90%,#ead0d8 0,transparent 35%),
        linear-gradient(135deg,var(--bg),var(--bg2));

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x:hidden;
}

body:before,
body:after{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.22;
    pointer-events:none;
}

body:before{
    background:#e6aabd;
    top:-120px;
    left:-120px;
}

body:after{
    background:#d7b89f;
    right:-120px;
    bottom:-120px;
}

.card{
    position:relative;
    z-index:5;

    width:min(600px,100%);

    padding:30px 28px 25px;

    background:var(--card);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.9);
    border-radius:38px;

    box-shadow:
        0 35px 90px rgba(80,35,52,.16),
        0 8px 30px rgba(80,35,52,.07);

    overflow:hidden;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    color:#9b828b;
    font-size:.68rem;
    letter-spacing:.2em;
    text-transform:uppercase;

    margin-bottom:22px;
}

.heart{
    font-size:1rem;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.25)}
}

.progress{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-bottom:30px;
}

.dot{
    width:6px;
    height:6px;
    border-radius:20px;
    background:#e3ccd3;
    transition:.35s;
}

.dot.done{
    background:var(--rose2);
}

.dot.active{
    width:25px;
    background:var(--rose);
    box-shadow:0 0 0 4px rgba(173,100,121,.11);
}

.content{
    min-height:340px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    animation:enter .55s ease both;
}

@keyframes enter{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.step-label{
    color:var(--rose);
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.25em;
    text-transform:uppercase;
    margin-bottom:15px;
}

.icon{
    width:88px;
    height:88px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:20px;

    border-radius:50%;

    background:
        linear-gradient(145deg,#fff,#f5e3e7);

    box-shadow:
        0 15px 35px rgba(100,50,70,.12);

    font-size:2.8rem;

    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
}

h1,h2{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:500;
    letter-spacing:-.035em;
}

h1{
    font-size:clamp(2.2rem,8vw,3.25rem);
    line-height:1.05;
    margin-bottom:15px;
}

h2{
    font-size:clamp(1.8rem,6vw,2.5rem);
    line-height:1.1;
    margin-bottom:15px;
}

.desc{
    max-width:470px;
    color:var(--muted);
    font-size:1rem;
    line-height:1.85;
}

.highlight{
    color:var(--rose2);
    font-weight:650;
}

.quote{
    max-width:470px;

    margin-top:20px;
    padding:17px 20px;

    border-left:2px solid var(--rose);
    border-radius:0 18px 18px 0;

    background:rgba(255,255,255,.6);

    color:#67545c;

    font-family:Georgia,serif;
    font-size:1.04rem;
    line-height:1.7;

    text-align:left;
}

.choice-wrap{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin-top:25px;
}

.choice{
    border:1px solid var(--line);
    background:rgba(255,255,255,.72);

    color:#624d56;

    padding:12px 17px;
    border-radius:50px;

    cursor:pointer;

    transition:.25s;

    font-size:.9rem;
}

.choice:hover{
    transform:translateY(-3px);
    background:#fff;
    border-color:var(--rose);
}

.choice.selected{
    background:var(--rose);
    color:#fff;
    border-color:var(--rose);
}

.actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
}

.btn{
    min-width:190px;

    border:none;
    border-radius:50px;

    padding:13px 24px;

    cursor:pointer;

    font-size:.92rem;
    font-weight:650;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
}

.primary{
    color:#fff;

    background:
        linear-gradient(135deg,var(--rose),var(--rose2));

    box-shadow:
        0 12px 28px rgba(140,71,94,.24);
}

.secondary{
    background:rgba(255,255,255,.7);
    border:1px solid var(--line);
    color:#654f58;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.reveal-card{
    width:100%;
    margin-top:22px;
    padding:24px;

    border:1px solid rgba(173,100,121,.14);
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.9),
            rgba(249,231,236,.65)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9);
}

.reveal-title{
    font-family:Georgia,serif;
    font-size:1.3rem;
    margin-bottom:12px;
}

.reveal-text{
    color:var(--muted);
    line-height:1.8;
    font-size:.94rem;
}

.flower{
    width:100%;
    margin-top:22px;

    overflow:hidden;

    border-radius:30px;
    border:5px solid rgba(255,255,255,.9);

    box-shadow:
        0 25px 65px rgba(75,35,50,.2);

    animation:
        flowerReveal 1.2s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes flowerReveal{
    from{
        opacity:0;
        transform:scale(.82) translateY(30px);
        filter:blur(9px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
        filter:blur(0);
    }
}

.flower img{
    display:block;
    width:100%;
    max-height:450px;
    object-fit:cover;
}

.final-message{
    margin-top:26px;
    animation:enter .8s .2s both;
}

.final-message p{
    color:var(--muted);
    line-height:1.9;
    font-size:1rem;
    margin-top:12px;
}

.signature{
    margin-top:20px;
    color:var(--rose2);
    font-family:Georgia,serif;
    font-style:italic;
    font-size:1.08rem;
}

.identity{
    margin-top:28px;
    padding:23px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.9),
            rgba(244,222,228,.6)
        );

    border:1px solid var(--line);

    text-align:left;
}

.identity-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.identity-label{
    font-size:.66rem;
    color:#9a8089;
    letter-spacing:.2em;
    text-transform:uppercase;
}

.verified{
    padding:6px 10px;
    border-radius:30px;

    color:#806173;
    background:#f2dfe5;

    font-size:.68rem;
    font-weight:700;
}

.identity-name{
    font-family:Georgia,serif;
    font-size:1.7rem;
    margin-bottom:18px;
}

.identity-row{
    display:flex;
    justify-content:space-between;
    gap:20px;

    padding:11px 0;

    border-bottom:1px solid rgba(170,120,135,.14);

    font-size:.87rem;
}

.identity-row:last-child{
    border-bottom:0;
}

.identity-row span:first-child{
    color:#9a8189;
}

.identity-row span:last-child{
    color:#493941;
    font-weight:600;
    text-align:right;
}

.feelings{
    margin-top:28px;
    padding-top:25px;
    border-top:1px dashed #dec4cc;
}

.feelings h3{
    font-family:Georgia,serif;
    font-size:1.4rem;
    font-weight:500;
}

.feelings p{
    color:var(--muted);
    font-size:.86rem;
    margin-top:6px;
}

.emojis{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:17px;
}

.emoji{
    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid var(--line);
    background:rgba(255,255,255,.75);

    cursor:pointer;

    font-size:1.35rem;

    transition:.2s;
}

.emoji:hover{
    transform:translateY(-4px) scale(1.06);
}

.emoji.active{
    background:var(--soft);
    border-color:var(--rose);
    transform:scale(1.08);
}

.reaction{
    margin-top:15px;
    padding:12px 17px;

    border-radius:17px;

    background:rgba(255,255,255,.7);

    color:#66505a;

    line-height:1.6;

    animation:enter .35s both;
}

.footer{
    margin-top:24px;
    text-align:center;

    color:#a48e96;

    font-size:.67rem;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.petals{
    position:fixed;
    inset:0;
    z-index:100;

    pointer-events:none;
    overflow:hidden;
}

.petal{
    position:absolute;
    top:-50px;

    animation:
        fall linear forwards;
}

@keyframes fall{
    0%{
        transform:
            translateY(-10vh)
            rotate(0deg)
            scale(.7);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(115vh)
            translateX(100px)
            rotate(720deg)
            scale(1);
        opacity:0;
    }
}

.hidden{
    display:none;
}

@media(max-width:520px){

    body{
        padding:10px;
    }

    .card{
        padding:24px 17px;
        border-radius:31px;
    }

    .content{
        min-height:350px;
    }

    .icon{
        width:78px;
        height:78px;
        font-size:2.4rem;
    }

    .desc{
        font-size:.94rem;
    }

    .quote{
        font-size:.94rem;
    }

    .btn{
        width:100%;
    }

    .actions{
        width:100%;
    }

    .flower img{
        max-height:350px;
    }

    .identity-row{
        flex-direction:column;
        gap:4px;
    }

    .identity-row span:last-child{
        text-align:left;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="top">
        <span>A little something for you</span>
        <span class="heart">♡</span>
    </div>

    <div class="progress" id="progress"></div>

    <div class="content" id="content"></div>

    <div class="actions" id="actions"></div>

    <div id="final"></div>

    <div class="footer">
        made with sincerity, loyalty & a little courage
    </div>

</div>

<div class="petals" id="petals"></div>


<script>
(function(){

/* ==========================================================
   FLOWER
   ========================================================== */

const FLOWER_IMAGE = "flower-photo.jpeg";


/* ==========================================================
   PRIVATE IDENTITY
   NOTE:
   These are encoded only to avoid obvious plain-text values.
   A static website cannot provide real secrecy.
   ========================================================== */

const PRIVATE = {
    name: "Saba Afzal",

    mobile: atob("MDMzMzQ2NzIyMjA="),

    cnic: atob("MzUyMDEwODgwMjI5OA==")
};


/* ==========================================================
   STORY
   ========================================================== */

const STEPS = [

{
    icon:"🌙",
    title:"Hey… beautiful.",
    text:
        "I could have simply sent you a message, " +
        "but some feelings deserve a little more than a notification.",
    button:"I'm listening →"
},

{
    icon:"🤍",
    title:"Stay here for a moment.",
    text:
        "No rush. No guessing. Just take a breath and let this little journey unfold.",
    quote:
        "Sometimes the smallest moments become the ones we remember the longest.",
    button:"I'm here"
},

{
    icon:"✨",
    title:"This isn't really a surprise.",
    text:
        "It's a small collection of thoughts I've wanted to put into words for you.",
    button:"Continue"
},

{
    icon:"🌷",
    title:"People become special quietly.",
    text:
        "Not always through some dramatic moment… sometimes it happens through conversations, little smiles, kindness, and simply being there.",
    quote:
        "The heart rarely announces when someone is becoming important. It simply starts remembering them.",
    button:"That is true"
},

{
    icon:"💭",
    title:"Can I ask you something?",
    text:
        "What matters more to you when two people choose each other?",
    choices:[
        "Trust 🤍",
        "Loyalty ❤️",
        "Understanding 🌷",
        "Everything together ✨"
    ]
},

{
    icon:"🫶",
    title:"For me, it's loyalty.",
    text:
        "Because beautiful words are easy. Real loyalty is what stays when life becomes ordinary, difficult, busy, or imperfect.",
    quote:
        "I don't want something that only looks beautiful. I want something that remains beautiful because both people choose it.",
    button:"Continue →"
},

{
    icon:"🌸",
    title:"And I want you to know this.",
    text:
        "I appreciate the person you are — not just the smile, not just the beauty, but the heart behind it.",
    quote:
        "Your kindness, your presence, your little ways of being you… those things matter.",
    button:"One more →"
},

{
    icon:"❤️",
    title:"I believe love should feel safe.",
    text:
        "Not like pressure. Not like possession. Not like constantly proving something.",
    quote:
        "It should feel like two people saying: I choose you, I respect you, and I will keep choosing you.",
    button:"Keep going ❤️"
},

{
    icon:"🔐",
    title:"There is a promise hidden here.",
    text:
        "If you give me loyalty, you will never have to wonder whether I understand its value.",
    quote:
        "If you are loyal to me, I will be twice as loyal to you — not because I have to, but because that's how I want to love.",
    button:"I like that"
},

{
    icon:"🥹",
    title:"I don't need perfection.",
    text:
        "I would rather have honesty, respect, laughter, patience, and two people who know how to stand beside each other.",
    quote:
        "Because a beautiful relationship isn't built by perfect people. It's built by sincere people.",
    button:"Almost there…"
},

{
    icon:"🎀",
    title:"And this little flower?",
    text:
        "It's small compared with everything I could say, but I wanted you to have something beautiful that carries a simple message.",
    button:"Show me 🌷"
},

{
    icon:"🌹",
    title:"One last thought.",
    text:
        "If life gives us thousands of ordinary days together, I hope we fill them with enough little beautiful moments to make them extraordinary.",
    quote:
        "“The best kind of love is the one that makes you feel at home, while still making your heart feel excited.”",
    button:"I'm ready"
},

{
    icon:"💌",
    title:"This one is truly for you.",
    text:
        "No more questions. No more steps. Just one little reminder of what you mean to me.",
    button:"Open it ✨"
},

{
    icon:"🌸",
    title:"Ready?",
    text:
        "Then let me finally show you what I made for you.",
    quote:
        "Some gifts are wrapped in paper. Some are wrapped in feelings.",
    button:"Open my surprise 🌷"
}

];


let current = 0;
let finalOpened = false;
let selected = null;

const progress =
    document.getElementById("progress");

const content =
    document.getElementById("content");

const actions =
    document.getElementById("actions");

const final =
    document.getElementById("final");

const petals =
    document.getElementById("petals");


/* ==========================================================
   PROGRESS
   ========================================================== */

function renderProgress(){

    progress.innerHTML="";

    STEPS.forEach((_,i)=>{

        const dot =
            document.createElement("span");

        dot.className="dot";

        if(i<current)
            dot.classList.add("done");

        if(i===current)
            dot.classList.add("active");

        progress.appendChild(dot);
    });
}


/* ==========================================================
   STEP
   ========================================================== */

function renderStep(){

    const step = STEPS[current];

    selected = null;

    renderProgress();

    content.innerHTML=`
        <div class="step-label">
            Chapter ${String(current+1).padStart(2,"0")}
            · ${STEPS.length}
        </div>

        <div class="icon">
            ${step.icon}
        </div>

        <h2>${step.title}</h2>

        <div class="desc">
            ${step.text}
        </div>

        ${
            step.quote
            ? `<div class="quote">${step.quote}</div>`
            : ""
        }
    `;

    actions.innerHTML="";


    /* choices */

    if(step.choices){

        const wrap =
            document.createElement("div");

        wrap.className="choice-wrap";

        step.choices.forEach(choice=>{

            const btn =
                document.createElement("button");

            btn.className="choice";

            btn.textContent=choice;

            btn.onclick=()=>{

                selected=choice;

                wrap
                    .querySelectorAll(".choice")
                    .forEach(x=>
                        x.classList.remove("selected")
                    );

                btn.classList.add("selected");

                next.disabled=false;
            };

            wrap.appendChild(btn);
        });

        actions.appendChild(wrap);


        const next =
            document.createElement("button");

        next.className="btn primary";

        next.textContent="Continue →";

        next.disabled=true;

        next.style.marginTop="10px";

        next.onclick=goNext;

        actions.appendChild(next);

        return;
    }


    /* normal button */

    const button =
        document.createElement("button");

    button.className="btn primary";

    button.textContent=step.button;

    button.onclick=goNext;

    actions.appendChild(button);
}


/* ==========================================================
   NEXT
   ========================================================== */

function goNext(){

    if(current < STEPS.length-1){

        current++;

        renderStep();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        revealFinal();
    }
}


/* ==========================================================
   FINAL REVEAL
   ========================================================== */

function revealFinal(){

    if(finalOpened) return;

    finalOpened=true;

    progress.innerHTML="";

    content.innerHTML=`
        <div class="step-label">
            JUST FOR YOU
        </div>

        <div class="icon">
            🌸
        </div>

        <h1>
            My gorgeous Saba
        </h1>

        <div class="desc">
            Some things are difficult to say in one message.
            So I made you a little journey instead.
        </div>
    `;

    actions.innerHTML="";


    final.innerHTML=`

        <div class="flower">
            <img
                src="${FLOWER_IMAGE}"
                alt="A beautiful flower for Saba"
            >
        </div>


        <div class="final-message">

            <h2>
                My gorgeous 🌸
            </h2>

            <p>
                This beautiful flower is for you —
                just a little reminder of how special
                and lovely you are.
                I hope it brings a little smile to your face,
                because you truly deserve it.
                ❤️🌸
            </p>

            <p>
                My sweet, gorgeous, beautiful ❤️
            </p>

            <p>
                This little flower is for you 🌸 —
                a small gift, but given with my whole heart.
                Please accept it, because it carries
                all the love, care, and warmth I have for you.
                You deserve every beautiful thing in this world.
                ❤️🌸
            </p>

            <div class="signature">
                With sincerity, with respect, and with a heart
                that chooses loyalty. 🤍
            </div>

        </div>


        <div class="identity">

            <div class="identity-top">

                <div class="identity-label">
                    Made especially for
                </div>

                <div class="verified">
                    ✦ MY PERSON
                </div>

            </div>

            <div class="identity-name">
                ${PRIVATE.name}
            </div>

            <div class="identity-row">
                <span>Full Name</span>
                <span>${PRIVATE.name}</span>
            </div>

            <div class="identity-row">
                <span>CNIC</span>
                <span>${PRIVATE.cnic}</span>
            </div>

            <div class="identity-row">
                <span>Phone</span>
                <span>${PRIVATE.mobile}</span>
            </div>

        </div>


        <div class="reveal-card">

            <div class="reveal-title">
                And if you ever wonder what I want… 🤍
            </div>

            <div class="reveal-text">
                I want honesty when things are easy,
                patience when things are difficult,
                laughter on ordinary days,
                respect in every situation,
                and loyalty when nobody is watching.
                <br><br>
                And if you give me that,
                I'll give you more of it in return.
            </div>

        </div>


        <div class="feelings">

            <h3>
                Now tell me honestly… 🫣
            </h3>

            <p>
                What did this little journey make you feel?
            </p>

            <div class="emojis">

                <button class="emoji"
                    data-msg="That smile was exactly what I hoped for. 🥹❤️">
                    🥹
                </button>

                <button class="emoji"
                    data-msg="Okay… that reaction just made this worth it. 😍">
                    😍
                </button>

                <button class="emoji"
                    data-msg="If I made you laugh, mission accomplished. 😂❤️">
                    😂
                </button>

                <button class="emoji"
                    data-msg="Speechless? I'll happily take that. 😳🌸">
                    😳
                </button>

                <button class="emoji"
                    data-msg="That heart means more than you know. ❤️">
                    ❤️
                </button>

                <button class="emoji"
                    data-msg="Now you're making me blush too. 🙈">
                    🙈
                </button>

            </div>

            <div
                class="reaction"
                id="reaction"
                style="display:none">
            </div>

        </div>
    `;


    document
        .querySelectorAll(".emoji")
        .forEach(button=>{

            button.onclick=()=>{

                document
                    .querySelectorAll(".emoji")
                    .forEach(x=>
                        x.classList.remove("active")
                    );

                button.classList.add("active");

                const reaction =
                    document.getElementById("reaction");

                reaction.textContent =
                    button.dataset.msg;

                reaction.style.display="block";
            };

        });


    createPetals();

}


/* ==========================================================
   FLOWERS
   ========================================================== */

function createPetals(){

    const items=[
        "🌸",
        "🌷",
        "🌹",
        "🌺",
        "🌼",
        "💮",
        "❤️"
    ];

    for(let i=0;i<55;i++){

        setTimeout(()=>{

            const petal =
                document.createElement("div");

            petal.className="petal";

            petal.textContent =
                items[
                    Math.floor(
                        Math.random()*items.length
                    )
                ];

            petal.style.left =
                Math.random()*100+"%";

            petal.style.fontSize =
                (1+Math.random()*1.4)+"rem";

            petal.style.animationDuration =
                (4+Math.random()*4)+"s";

            petals.appendChild(petal);

            setTimeout(()=>{
                petal.remove();
            },8500);

        },i*80);
    }
}


/* ==========================================================
   START
   ========================================================== */

renderStep();

})();
