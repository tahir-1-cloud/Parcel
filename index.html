<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />

    <title>Something I Made For You 🌸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:
                Inter,
                "Segoe UI",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;
        }

        :root {
            --bg-1: #fff7f8;
            --bg-2: #f7e8eb;
            --card: rgba(255, 250, 251, 0.82);

            --text: #30242a;
            --muted: #806c75;

            --rose: #b96f82;
            --rose-dark: #8f4d61;
            --rose-light: #f1d9df;

            --gold: #b99a64;

            --shadow:
                0 30px 80px rgba(91, 47, 62, 0.15),
                0 10px 30px rgba(91, 47, 62, 0.08);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,255,255,.95),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(232,190,201,.5),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--bg-1),
                    var(--bg-2)
                );

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
        }

        .glow.one {
            width: 260px;
            height: 260px;
            background: #f6cdd8;
            top: -100px;
            left: -80px;
        }

        .glow.two {
            width: 320px;
            height: 320px;
            background: #ead3c2;
            right: -130px;
            bottom: -100px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            position: relative;
            z-index: 10;

            width: min(560px, 100%);

            padding: 34px 28px 30px;

            background: var(--card);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border-radius: 42px;

            border: 1px solid rgba(255,255,255,.8);

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        /* =========================
           TOP
        ========================= */

        .top-line {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;

            color: var(--muted);

            font-size: .72rem;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .tiny-heart {
            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0%,100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.18);
            }

            30% {
                transform: scale(1);
            }
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 7px;

            margin-bottom: 30px;
        }

        .progress-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #e3cbd2;

            transition:
                .35s ease;
        }

        .progress-dot.active {
            width: 24px;
            border-radius: 20px;

            background: var(--rose);

            box-shadow:
                0 0 0 4px rgba(185,111,130,.12);
        }

        .progress-dot.done {
            background: var(--rose-dark);
        }

        /* =========================
           STEP
        ========================= */

        .step-content {
            min-height: 310px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            animation:
                stepIn .55s ease both;
        }

        @keyframes stepIn {
            from {
                opacity: 0;
                transform:
                    translateY(18px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .step-number {
            margin-bottom: 12px;

            color: var(--rose);

            font-size: .72rem;
            font-weight: 700;

            letter-spacing: .25em;

            text-transform: uppercase;
        }

        .big-icon {
            width: 92px;
            height: 92px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #fff,
                    #f7e4e8
                );

            box-shadow:
                0 15px 35px rgba(120,60,80,.12),
                inset 0 0 0 1px rgba(185,111,130,.08);

            font-size: 3rem;

            animation:
                floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        h1 {
            max-width: 470px;

            margin-bottom: 14px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(2rem, 7vw, 3rem);

            line-height: 1.1;

            font-weight: 500;

            letter-spacing: -.04em;
        }

        h2 {
            max-width: 470px;

            margin-bottom: 14px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(1.7rem, 6vw, 2.4rem);

            line-height: 1.15;

            font-weight: 500;
        }

        .description {
            max-width: 430px;

            color: var(--muted);

            font-size: 1rem;

            line-height: 1.85;
        }

        .highlight {
            color: var(--rose-dark);
            font-weight: 600;
        }

        .quote {
            max-width: 430px;

            margin-top: 20px;
            padding: 17px 22px;

            border-left: 2px solid var(--rose);

            background:
                rgba(255,255,255,.55);

            border-radius: 0 18px 18px 0;

            color: #66535b;

            font-family:
                Georgia,
                serif;

            font-size: 1.05rem;

            line-height: 1.7;

            text-align: left;
        }

        /* =========================
           INTERACTIVE CHOICES
        ========================= */

        .choices {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-top: 24px;

            width: 100%;
        }

        .choice {
            padding: 12px 18px;

            border: 1px solid #ead4da;

            border-radius: 50px;

            background: rgba(255,255,255,.7);

            color: #5c4750;

            cursor: pointer;

            font-size: .92rem;

            transition:
                .25s ease;
        }

        .choice:hover {
            transform: translateY(-3px);

            border-color: var(--rose);

            background: #fff;

            box-shadow:
                0 8px 20px rgba(100,50,70,.08);
        }

        .choice.selected {
            background: var(--rose);

            border-color: var(--rose);

            color: white;

            transform: translateY(-2px);
        }

        /* =========================
           BUTTONS
        ========================= */

        .action-area {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            margin-top: 18px;
        }

        .btn {
            min-width: 180px;

            padding: 13px 24px;

            border: none;

            border-radius: 50px;

            cursor: pointer;

            font-size: .95rem;
            font-weight: 600;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    var(--rose),
                    var(--rose-dark)
                );

            color: white;

            box-shadow:
                0 10px 25px rgba(143,77,97,.25);
        }

        .btn-secondary {
            background: rgba(255,255,255,.7);

            border: 1px solid #ead4da;

            color: #684f59;
        }

        .btn:active {
            transform: translateY(0);
        }

        /* =========================
           FINAL IMAGE
        ========================= */

        .flower-reveal {
            width: 100%;

            margin-top: 22px;

            border-radius: 30px;

            overflow: hidden;

            border: 5px solid rgba(255,255,255,.85);

            box-shadow:
                0 25px 60px rgba(95,45,65,.22);

            animation:
                imageReveal 1.2s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes imageReveal {
            from {
                opacity: 0;
                transform:
                    scale(.82)
                    translateY(25px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
                filter: blur(0);
            }
        }

        .flower-reveal img {
            width: 100%;

            display: block;

            max-height: 430px;

            object-fit: cover;
        }

        /* =========================
           FINAL MESSAGE
        ========================= */

        .final-message {
            margin-top: 25px;

            animation:
                stepIn .8s ease .2s both;
        }

        .final-message h2 {
            margin-bottom: 12px;
        }

        .final-message p {
            color: var(--muted);

            line-height: 1.9;

            font-size: 1rem;
        }

        .signature {
            margin-top: 20px;

            color: var(--rose-dark);

            font-family:
                Georgia,
                serif;

            font-size: 1.15rem;

            font-style: italic;
        }

        /* =========================
           FEELINGS
        ========================= */

        .feelings {
            margin-top: 28px;

            padding-top: 25px;

            border-top:
                1px dashed #dfc4cc;
        }

        .feelings-title {
            margin-bottom: 7px;

            font-family:
                Georgia,
                serif;

            font-size: 1.3rem;
        }

        .feelings-sub {
            color: var(--muted);

            font-size: .86rem;

            margin-bottom: 15px;
        }

        .emoji-grid {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;
        }

        .emoji-btn {
            width: 48px;
            height: 48px;

            border: 1px solid #ead4da;

            border-radius: 50%;

            background: rgba(255,255,255,.7);

            font-size: 1.35rem;

            cursor: pointer;

            transition:
                .2s ease;
        }

        .emoji-btn:hover {
            transform:
                translateY(-4px)
                scale(1.06);

            background: white;
        }

        .emoji-btn.selected {
            background: var(--rose-light);

            border-color: var(--rose);

            transform:
                scale(1.08);

            box-shadow:
                0 0 0 4px rgba(185,111,130,.1);
        }

        .reaction {
            margin-top: 15px;

            padding: 12px 18px;

            border-radius: 18px;

            background: rgba(255,255,255,.65);

            color: #644f58;

            line-height: 1.6;

            animation:
                stepIn .35s ease both;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #a28d95;

            font-size: .72rem;

            letter-spacing: .12em;

            text-transform: uppercase;
        }

        /* =========================
           PETALS
        ========================= */

        .petals {
            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 100;
        }

        .petal {
            position: absolute;

            top: -50px;

            font-size: 1.6rem;

            animation:
                petalFall linear forwards;
        }

        @keyframes petalFall {

            0% {
                transform:
                    translateY(-10vh)
                    rotate(0deg)
                    scale(.7);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(115vh)
                    translateX(80px)
                    rotate(720deg)
                    scale(1);

                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {
                padding: 12px;
            }

            .card {
                padding:
                    25px 18px 24px;

                border-radius: 32px;
            }

            .step-content {
                min-height: 340px;
            }

            .big-icon {
                width: 78px;
                height: 78px;

                font-size: 2.5rem;
            }

            .description {
                font-size: .94rem;
            }

            .quote {
                font-size: .95rem;
            }

            .flower-reveal img {
                max-height: 330px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow">
        <div class="glow one"></div>
        <div class="glow two"></div>
    </div>

    <div class="card">

        <div class="top-line">
            <span>Something personal</span>
            <span class="tiny-heart">♡</span>
        </div>

        <div class="progress" id="progress"></div>

        <div id="stepContent"></div>

        <div class="action-area" id="actionArea"></div>

        <div id="finalArea"></div>

        <div class="footer">
            made with a little courage & a lot of feelings
        </div>

    </div>

    <div class="petals" id="petals"></div>


<script>

(function () {

    /*
    ============================================================
        CONFIGURATION
    ============================================================
    */

    const FLOWER_IMAGE = "flower-photo.jpeg";


    /*
    ============================================================
        STORY STEPS
    ============================================================
    */

    const STEPS = [

        {
            icon: "🌙",
            title: "Hey… you.",
            text:
                "I could have simply sent you a message… " +
                "but somehow, that didn't feel enough.",
            button:
                "Okay… I'm listening →"
        },

        {
            icon: "🤍",
            title: "Before you continue…",
            text:
                "Forget everything else for a moment. " +
                "No rushing. No guessing. Just stay here for a little while.",
            button:
                "I'm here"
        },

        {
            icon: "✨",
            title: "Take a little breath.",
            text:
                "Because the next few steps aren't really about a parcel… " +
                "they're about something I've been carrying in my heart.",
            button:
                "Continue slowly →"
        },

        {
            icon: "🌷",
            title: "Some people are different.",
            text:
                "You don't always realize when someone starts becoming " +
                "<span class='highlight'>special</span> to you.",
            quote:
                "It happens quietly… in the little conversations, the random smiles, and the moments you remember without trying.",
            button:
                "I understand →"
        },

        {
            icon: "💭",
            title: "Can I ask you something?",
            text:
                "When you think about the people who make your days a little better…",
            choices: [
                "I know someone like that",
                "Maybe I do 👀",
                "I'm not answering 😌"
            ]
        },

        {
            icon: "🫶",
            title: "Here's what I realized.",
            text:
                "Your presence has a way of making ordinary moments feel a little less ordinary.",
            quote:
                "And honestly… I don't think that's something I should keep pretending I don't notice.",
            button:
                "Keep going…"
        },

        {
            icon: "🌸",
            title: "There is something I like about you.",
            text:
                "It's not just one thing. It's the little things. " +
                "The way you are. The way you make conversations feel. " +
                "The way somehow… you stay on my mind.",
            button:
                "One more step →"
        },

        {
            icon: "❤️",
            title: "So here is the honest part.",
            text:
                "I don't know exactly where this feeling is supposed to go.",
            quote:
                "I just know that somewhere along the way, you became someone I genuinely care about.",
            button:
                "I'm still here ❤️"
        },

        {
            icon: "🎀",
            title: "And this little surprise…",
            text:
                "isn't meant to ask anything from you.",
            quote:
                "It's simply my way of saying: I'm glad you exist, and I'm really glad our paths crossed.",
            button:
                "Almost there…"
        },

        {
            icon: "🥹",
            title: "One last thing.",
            text:
                "I wanted to give you something beautiful… " +
                "because sometimes a few words just don't feel like enough.",
            button:
                "Show me 🌷"
        },

        {
            icon: "🌹",
            title: "Ready?",
            text:
                "No more steps after this.",
            quote:
                "Whatever happens next… I hope this little moment makes you smile.",
            button:
                "Open my surprise ✨"
        }

    ];


    /*
    ============================================================
        STATE
    ============================================================
    */

    let currentStep = 0;

    let selectedChoice = null;

    let finalOpened = false;


    /*
    ============================================================
        ELEMENTS
    ============================================================
    */

    const progress =
        document.getElementById("progress");

    const stepContent =
        document.getElementById("stepContent");

    const actionArea =
        document.getElementById("actionArea");

    const finalArea =
        document.getElementById("finalArea");

    const petals =
        document.getElementById("petals");


    /*
    ============================================================
        PROGRESS
    ============================================================
    */

    function renderProgress() {

        progress.innerHTML = "";

        STEPS.forEach((_, index) => {

            const dot =
                document.createElement("span");

            dot.className =
                "progress-dot";

            if (index < currentStep) {
                dot.classList.add("done");
            }

            if (index === currentStep) {
                dot.classList.add("active");
            }

            progress.appendChild(dot);

        });

    }


    /*
    ============================================================
        STEP RENDER
    ============================================================
    */

    function renderStep() {

        const step =
            STEPS[currentStep];

        selectedChoice = null;

        renderProgress();

        stepContent.innerHTML = `
            <div class="step-number">
                Step ${String(currentStep + 1).padStart(2, "0")}
                / ${String(STEPS.length).padStart(2, "0")}
            </div>

            <div class="big-icon">
                ${step.icon}
            </div>

            <h2>
                ${step.title}
            </h2>

            <p class="description">
                ${step.text}
            </p>

            ${
                step.quote
                    ? `
                        <div class="quote">
                            ${step.quote}
                        </div>
                    `
                    : ""
            }
        `;


        actionArea.innerHTML = "";


        /*
        ------------------------------
        CHOICES
        ------------------------------
        */

        if (step.choices) {

            const choices =
                document.createElement("div");

            choices.className =
                "choices";

            step.choices.forEach(choice => {

                const button =
                    document.createElement("button");

                button.className =
                    "choice";

                button.textContent =
                    choice;

                button.addEventListener(
                    "click",
                    () => {

                        selectedChoice =
                            choice;

                        choices
                            .querySelectorAll(".choice")
                            .forEach(el =>
                                el.classList.remove("selected")
                            );

                        button.classList.add(
                            "selected"
                        );

                        continueButton.disabled =
                            false;

                    }
                );

                choices.appendChild(button);

            });


            actionArea.appendChild(
                choices
            );


            const continueButton =
                document.createElement("button");

            continueButton.className =
                "btn btn-primary";

            continueButton.textContent =
                "Continue →";

            continueButton.disabled =
                true;

            continueButton.style.marginTop =
                "8px";

            continueButton.addEventListener(
                "click",
                nextStep
            );

            actionArea.appendChild(
                continueButton
            );

            return;
        }


        /*
        ------------------------------
        NORMAL BUTTON
        ------------------------------
        */

        const button =
            document.createElement("button");

        button.className =
            "btn btn-primary";

        button.textContent =
            step.button;

        button.addEventListener(
            "click",
            nextStep
        );

        actionArea.appendChild(
            button
        );

    }


    /*
    ============================================================
        NEXT STEP
    ============================================================
    */

    function nextStep() {

        if (
            currentStep <
            STEPS.length - 1
        ) {

            currentStep++;

            renderStep();

        } else {

            openFinalReveal();

        }

    }


    /*
    ============================================================
        FINAL REVEAL
    ============================================================
    */

    function openFinalReveal() {

        if (finalOpened) {
            return;
        }

        finalOpened = true;

        progress.innerHTML = "";

        stepContent.innerHTML = `
            <div class="step-number">
                THE END OF THE LITTLE JOURNEY
            </div>

            <div class="big-icon">
                🌸
            </div>

            <h1>
                This one is for you.
            </h1>

            <p class="description">
                No more guessing.
                No more steps.
                Just a little something I wanted you to have.
            </p>
        `;

        actionArea.innerHTML = "";

        finalArea.innerHTML = `

            <div class="flower-reveal">

                <img
                    src="${FLOWER_IMAGE}"
                    alt="A flower for you"
                    onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 600%22%3E%3Crect width=%22600%22 height=%22600%22 fill=%22%23f7e8eb%22/%3E%3Ctext x=%22300%22 y=%22290%22 text-anchor=%22middle%22 font-size=%22120%22%3E🌷%3C/text%3E%3Ctext x=%22300%22 y=%22390%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2230%22 fill=%22%238f4d61%22%3EFor you%3C/text%3E%3C/svg%3E'"
                />

            </div>


            <div class="final-message">

                <h2>
                    A little flower, for someone special. 🌷
                </h2>

                <p>
                    I don't know if flowers can say everything
                    that words sometimes cannot…
                    but I hope this one says at least a little.
                </p>

                <p style="margin-top:12px;">
                    You are appreciated.
                    You are thought about.
                    And, whether you realize it or not,
                    <span class="highlight">
                        you mean more to me than you probably know.
                    </span>
                </p>

                <div class="signature">
                    — Just someone who wanted to make you smile. 🤍
                </div>

            </div>


            <div class="feelings">

                <div class="feelings-title">
                    Okay… now it's your turn. 🫣
                </div>

                <div class="feelings-sub">
                    Be honest. How did this make you feel?
                </div>

                <div class="emoji-grid">

                    <button
                        class="emoji-btn"
                        data-message="That smile better be real. 🥹❤️"
                    >
                        🥹
                    </button>

                    <button
                        class="emoji-btn"
                        data-message="Okayyy… I'll take that as a good sign. 😍"
                    >
                        😍
                    </button>

                    <button
                        class="emoji-btn"
                        data-message="I knew I could make you laugh. 😂"
                    >
                        😂
                    </button>

                    <button
                        class="emoji-btn"
                        data-message="Speechless? I'll consider that a win. 😳"
                    >
                        😳
                    </button>

                    <button
                        class="emoji-btn"
                        data-message="That little heart just made my day. ❤️"
                    >
                        ❤️
                    </button>

                    <button
                        class="emoji-btn"
                        data-message="Okay… now you're making me blush. 🙈"
                    >
                        🙈
                    </button>

                </div>

                <div
                    class="reaction"
                    id="reaction"
                    style="display:none;"
                ></div>

            </div>

        `;

        launchPetals();

        setupReactions();

    }


    /*
    ============================================================
        EMOJI REACTIONS
    ============================================================
    */

    function setupReactions() {

        const buttons =
            document.querySelectorAll(
                ".emoji-btn"
            );

        const reaction =
            document.getElementById(
                "reaction"
            );

        buttons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    buttons.forEach(btn =>
                        btn.classList.remove(
                            "selected"
                        )
                    );

                    button.classList.add(
                        "selected"
                    );

                    reaction.textContent =
                        button.dataset.message;

                    reaction.style.display =
                        "block";

                }
            );

        });

    }


    /*
    ============================================================
        FLOWER PETALS
    ============================================================
    */

    function launchPetals() {

        const flowers = [
            "🌸",
            "🌷",
            "🌹",
            "🌺",
            "🌼",
            "💮",
            "❤️"
        ];

        for (
            let i = 0;
            i < 45;
            i++
        ) {

            setTimeout(() => {

                const petal =
                    document.createElement(
                        "div"
                    );

                petal.className =
                    "petal";

                petal.textContent =
                    flowers[
                        Math.floor(
                            Math.random() *
                            flowers.length
                        )
                    ];

                petal.style.left =
                    Math.random() * 100 + "%";

                petal.style.fontSize =
                    (
                        1 +
                        Math.random() * 1.5
                    ) + "rem";

                petal.style.animationDuration =
                    (
                        4 +
                        Math.random() * 4
                    ) + "s";

                petals.appendChild(
                    petal
                );

                setTimeout(() => {

                    petal.remove();

                }, 8500);

            }, i * 90);

        }

    }


    /*
    ============================================================
        START
    ============================================================
    */

    renderStep();

})();

</script>

</body>
</html>
